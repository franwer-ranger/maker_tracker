version: '3.9'
services:
  ruby:
    image: mcr.microsoft.com/devcontainers/ruby:1-3.2-bullseye
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    ports:
      - 3000:3000
    environment:
      - RAILS_ENV=development
      - REDIS_URL=redis://redis:6379/1
  redis:
    image: redis:6