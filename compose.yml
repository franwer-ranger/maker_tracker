# Maker Tracker for self-hosting. See docs/SELF_HOSTING.md.
#
#   docker compose up -d --build    install or update
#
# Settings are optional: copy .env.example to .env to change them.

name: maker-tracker

x-app: &app
  build: .
  image: maker-tracker
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - ${MAKER_TRACKER_DATA:-./data}/storage:/rails/storage
    - ${MAKER_TRACKER_DATA:-./data}/backups:/rails/backups
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  app:
    <<: *app
    # Only reachable from this machine. Put it on your network with
    # `tailscale serve` or a reverse proxy, never by opening this port.
    ports:
      - "127.0.0.1:${MAKER_TRACKER_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    <<: *app
    command: ["bin/backup", "--loop"]
    depends_on:
      app:
        condition: service_healthy
